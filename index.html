<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30233f"><title>Слова та вирази — практика</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352a43;background:#30233f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}body::before{content:"";position:fixed;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffd6bc,#dba88f 38%,#8b6da3 70%,#493257);top:-250px;right:-120px;box-shadow:0 0 100px #daa0bd26;pointer-events:none}body::after{content:"";position:fixed;width:330px;height:330px;border:55px solid #9c80b6;border-radius:50%;bottom:-170px;left:-120px;transform:rotate(-25deg);box-shadow:inset 12px 12px 24px #15101e70,12px 12px 40px #130d2270;pointer-events:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #9662b5;outline-offset:5px}.wrap{min-height:100svh;display:grid;place-items:center;padding:70px 30px;position:relative;z-index:1;overflow:hidden}.card{width:100%;max-width:780px;padding:38px 48px 30px;border-radius:26px;background:#fff9f5;position:relative;box-shadow:0 30px 90px #0c061c55,0 2px 0 #ffffff80 inset;isolation:isolate}.card::before{content:"";position:absolute;inset:0;border-radius:26px;background:#b69acb;transform:rotate(-3deg);z-index:-2;box-shadow:0 16px 45px #110a2026}.card::after{content:"";position:absolute;inset:0;border-radius:26px;background:#fff9f5;z-index:-1}.topline{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:#7c6b88;font-variant-numeric:tabular-nums}.topline>span{border:1px solid #e2d4e8;padding:9px 14px;border-radius:24px;background:#f4edf7}.progress{width:108px;height:5px;background:#e7dced;border-radius:4px;overflow:hidden}.progress i{display:block;height:100%;background:#9864ad;transition:width .3s;border-radius:4px}.sentence{font-size:clamp(27px,3.5vw,37px);font-weight:550;line-height:1.48;letter-spacing:-1.1px;margin:42px 0 36px;min-height:130px}.blank{color:#86509f;white-space:nowrap;border-bottom:3px solid #c4a1d4;padding:0 5px}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{position:relative;background:#ede0f4;border:1px solid #c6a5d7;border-radius:15px;padding:25px 38px 25px 22px;text-align:left;font-size:19px;font-weight:550;color:#624275;box-shadow:0 4px 0 #cbb0da;transition:background .18s,transform .18s,box-shadow .18s}.option::after{content:"↗";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:400;color:#9974ac}.option:nth-child(2){background:#fbe2d3;border-color:#e8bfa8;color:#80523b;box-shadow:0 4px 0 #e2b59c}.option:nth-child(2)::after{color:#ac795e}.option:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 7px 0 #cbb0da;background:#e3cdeb}.option:nth-child(2):hover:not(:disabled){background:#f5d0bb;box-shadow:0 7px 0 #e2b59c}.option:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #cbb0da}.option.correct{background:#e0edc5;border-color:#acc482;color:#3e582b;box-shadow:0 4px 0 #b7c999}.option.wrong{background:#f3d7d2;border-color:#d7a59d;color:#8b4b45;box-shadow:0 4px 0 #d7aaa3}.option:disabled{cursor:default;opacity:1}.option:disabled::after{display:none}.feedback{margin-top:26px;padding:18px 20px;background:#f3ebf7;border-left:3px solid #ae85c1;border-radius:0 12px 12px 0;font-size:14px;color:#796485;line-height:1.75;animation:appear .25s ease}.feedback strong{display:block;color:#694180;font-weight:600;margin-bottom:4px}.actions{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:30px;min-height:47px}.primary{background:#694180;border:0;border-radius:25px;padding:14px 24px;color:#fff9f5;font-size:14px;transition:transform .2s,background .2s}.primary:hover{background:#86569e;transform:translateX(2px)}.textbtn{background:none;border:0;padding:12px 0;font-size:13px;color:#887294}.textbtn:hover{color:#694180}.textbtn:disabled{visibility:hidden}.result .score{font-size:90px;font-weight:500;letter-spacing:-5px;color:#86509f;margin:14px 0 26px}.result .score span{font-size:30px;color:#b49bc0;letter-spacing:0}.result h2{font-size:18px;font-weight:500;margin:8px 0;color:#846c91}.review{font-size:14px;line-height:1.8;border-top:1px solid #e5d8e9;padding:21px 0}.review b{font-size:17px;font-weight:600;color:#86509f}.review p{margin:8px 0;color:#806d8b}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:560px){.wrap{padding:55px 22px}.card{padding:26px 24px 22px;border-radius:22px}.card::before,.card::after{border-radius:22px}.sentence{margin:30px 0;min-height:145px;letter-spacing:-.6px;font-size:28px}.options{grid-template-columns:1fr;gap:16px}.option{padding:21px 40px 21px 21px;font-size:18px}.actions{margin-top:26px}.feedback{font-size:13px;padding:15px}.topline>span{padding:7px 12px}body::before{width:350px;height:350px;top:-190px;right:-150px}body::after{width:230px;height:230px;bottom:-180px;border-width:35px}.result .score{font-size:74px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
